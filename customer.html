<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客户详情 - 乡野别居</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f4f6f4; min-height: 100vh; }

        /* 顶部导航 */
        .header {
            background: #2c5f2d;
            color: white;
            padding: 0 20px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .header-left { display: flex; align-items: center; gap: 14px; }
        .back-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid rgba(255,255,255,0.4);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.82rem;
            cursor: pointer;
            text-decoration: none;
            white-space: nowrap;
        }
        .back-btn:hover { background: rgba(255,255,255,0.3); }
        .header-title { font-size: 1.1rem; font-weight: bold; letter-spacing: 1px; }
        .save-status { font-size: 0.8rem; opacity: 0.85; background: rgba(255,255,255,0.15); padding: 3px 10px; border-radius: 12px; }

        /* 页面内容 */
        .page-content { max-width: 860px; margin: 0 auto; padding: 20px 16px 60px; }

        /* 卡片通用 */
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.07);
            margin-bottom: 20px;
            overflow: hidden;
        }
        .card-header {
            background: #f0f7f0;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: bold;
            color: #2c5f2d;
            border-bottom: 1px solid #e0eee0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-body { padding: 20px; }

        /* 表单网格 */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .form-grid.cols3 { grid-template-columns: 1fr 1fr 1fr; }
        .form-grid.full { grid-template-columns: 1fr; }
        .field-group { display: flex; flex-direction: column; gap: 5px; }
        .field-group label { font-size: 0.78rem; color: #888; font-weight: 500; }
        .field-group input, .field-group textarea, .field-group select {
            padding: 9px 11px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.92rem;
            outline: none;
            font-family: inherit;
            background: #fafafa;
            transition: border-color 0.2s, background 0.2s;
        }
        .field-group input:focus, .field-group textarea:focus { border-color: #2c5f2d; background: white; }
        .field-group textarea { resize: vertical; min-height: 80px; }

        /* 保存按钮 */
        .save-btn {
            background: #2c5f2d;
            color: white;
            border: none;
            padding: 11px 28px;
            border-radius: 8px;
            font-size: 0.92rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 16px;
            transition: background 0.2s;
        }
        .save-btn:hover { background: #1e4420; }

        /* 材料总览卡片 */
        .mat-summary {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
            padding: 16px 20px;
        }
        .mat-card {
            background: linear-gradient(135deg, #f0f7f0 0%, #e8f4e8 100%);
            border-radius: 10px;
            padding: 14px;
            text-align: center;
            border: 1px solid #d5e8d5;
        }
        .mat-card-name {
            font-size: 0.82rem;
            color: #666;
            margin-bottom: 6px;
        }
        .mat-card-total {
            font-size: 1.4rem;
            font-weight: bold;
            color: #2c5f2d;
        }
        .mat-card-unit {
            font-size: 0.75rem;
            color: #888;
            margin-left: 2px;
        }

        /* Excel 风格材料表格 */
        .mat-section { border-bottom: 1px solid #e8f0e8; }
        .mat-section:last-child { border-bottom: none; }
        .mat-section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px 8px;
            background: #f8fdf8;
        }
        .mat-section-name {
            font-size: 0.92rem;
            font-weight: bold;
            color: #2c5f2d;
        }
        .mat-section-total {
            font-size: 0.8rem;
            color: #2c5f2d;
            background: #e0f0e0;
            padding: 3px 12px;
            border-radius: 12px;
            font-weight: 600;
        }
        .excel-wrap { overflow-x: auto; padding: 0 16px 4px; }
        .excel-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            min-width: 500px;
        }
        .excel-table thead th {
            background: #eef6ee;
            padding: 8px 10px;
            text-align: left;
            font-weight: 600;
            color: #4a7a4a;
            border: 1px solid #d8ead8;
            white-space: nowrap;
            font-size: 0.8rem;
        }
        .excel-table tbody tr { background: white; }
        .excel-table tbody tr:nth-child(even) { background: #fafff8; }
        .excel-table tbody tr:hover td { background: #f0f9f0; }
        .excel-table tbody td {
            border: 1px solid #e8f0e8;
            padding: 0;
            vertical-align: middle;
        }
        .excel-cell {
            width: 100%;
            padding: 8px 10px;
            border: none;
            background: transparent;
            font-size: 0.85rem;
            font-family: inherit;
            outline: none;
            color: #333;
            box-sizing: border-box;
        }
        .excel-cell:focus {
            background: #fffbe6;
            box-shadow: inset 0 0 0 2px #2c5f2d;
        }
        .excel-cell[type="date"] { color: #555; }
        .excel-cell::placeholder { color: #ccc; }
        .excel-del {
            background: none;
            border: none;
            color: #ddd;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 8px 12px;
            width: 100%;
            transition: color 0.15s;
        }
        .excel-del:hover { color: #e74c3c; }
        .excel-add-row {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 9px 20px;
            cursor: pointer;
            color: #5a9a5a;
            font-size: 0.82rem;
            border-top: 1px dashed #c8e0c8;
            transition: background 0.15s;
            user-select: none;
        }
        .excel-add-row:hover { background: #f0f9f0; color: #2c5f2d; }

        /* 小屏适配 */
        .no-records { text-align: center; color: #bbb; padding: 30px; font-size: 0.88rem; }

        /* 危险区域 */
        .danger-zone { padding: 16px 20px; background: #fff8f8; border-top: 1px solid #fde8e8; }
        .danger-btn {
            background: none;
            border: 1px solid #e74c3c;
            color: #e74c3c;
            padding: 8px 18px;
            border-radius: 7px;
            font-size: 0.82rem;
            cursor: pointer;
        }
        .danger-btn:hover { background: #fdecea; }

        /* Toast 提示 */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(44,95,45,0.95);
            color: white;
            padding: 10px 22px;
            border-radius: 24px;
            font-size: 0.88rem;
            z-index: 9999;
            transition: transform 0.3s ease;
            white-space: nowrap;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }

        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
            .form-grid.cols3 { grid-template-columns: 1fr 1fr; }
            .record-table th:nth-child(3), .record-table td:nth-child(3) { display: none; }
        }
    </style>
</head>
<body>

<header class="header">
    <div class="header-left">
        <a href="map.html" class="back-btn">← 返回地图</a>
        <span class="header-title" id="pageTitle">客户详情</span>
    </div>
    <span class="save-status" id="saveStatus">已保存</span>
</header>

<div class="page-content" id="pageContent">
    <div style="text-align:center;padding:60px;color:#aaa;">加载中...</div>
</div>

<div class="toast" id="toast"></div>

<script>
// ==========================================
// 数据读写（与 map.html 双键存储保持一致）
// ==========================================
const STORAGE_KEY = 'fanying_customers_v3';
const USER_KEY    = 'fanying_user_added';

function loadAll() {
    let base = [];
    let user = [];
    try { base = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch(e) {}
    try { user = JSON.parse(localStorage.getItem(USER_KEY))    || []; } catch(e) {}
    // 合并，去重（以 base 为主）
    const ids = new Set(base.map(v => v.id));
    user.forEach(v => { if (!ids.has(v.id)) base.push(v); });
    return base;
}

function saveAll(data) {
    // 同步写回双键：defaultVillages 范围内的 id（小于等于 18）写 STORAGE_KEY，其余写 USER_KEY
    // 为简单，这里用 id 判断： id <= 18 属于基础，> 18 属于用户新增
    const DEFAULT_MAX_ID = 49;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data.filter(v => v.id <= DEFAULT_MAX_ID)));
    localStorage.setItem(USER_KEY,    JSON.stringify(data.filter(v => v.id >  DEFAULT_MAX_ID)));
}

// 材料类型及默认单位（必须在 initPage 调用之前声明）
const MATERIALS = ['钢筋', '水泥', '沙子', '砖头', '石子', '混凝土', '机械费'];
const MAT_UNITS = {
    '钢筋': '吨',
    '水泥': '吨',
    '沙子': '方',
    '砖头': '块',
    '石子': '方',
    '混凝土': '方',
    '机械费': '元'
};
let currentMat = MATERIALS[0];

// 从 URL 获取客户 ID
const urlId = parseInt(new URLSearchParams(location.search).get('id'));
let allData = loadAll();
let customer = allData.find(v => v.id === urlId);

if (!customer) {
    document.getElementById('pageContent').innerHTML = `
        <div style="text-align:center;padding:80px 20px;color:#888;">
            <div style="font-size:3rem;margin-bottom:16px;">😕</div>
            <div style="font-size:1.1rem;margin-bottom:12px;">未找到该客户信息</div>
            <a href="map.html" style="color:#2c5f2d;">← 返回地图</a>
        </div>`;
} else {
    initPage();
}

function save() {
    allData = loadAll();
    const idx = allData.findIndex(v => v.id === customer.id);
    if (idx >= 0) allData[idx] = customer;
    saveAll(allData);
    showToast('✅ 已保存');
    document.getElementById('saveStatus').textContent = '已保存 ' + new Date().toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'});
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
}

// （MATERIALS 和 currentMat 已在上方提前声明）

function initPage() {
    document.getElementById('pageTitle').textContent = `${customer.name} · ${customer.customer}`;
    document.title = `${customer.customer} - 客户详情`;

    // 确保材料字段存在
    if (!customer.materials) customer.materials = {};
    MATERIALS.forEach(m => { if (!customer.materials[m]) customer.materials[m] = []; });

    document.getElementById('pageContent').innerHTML = buildPageHTML();
    bindInfoForm();
    initQuickAdd();
    renderMaterials();
}

function buildPageHTML() {
    const v = customer;
    return `
    <!-- 基本信息 -->
    <div class="card">
        <div class="card-header">👤 客户基本信息</div>
        <div class="card-body">
            <div class="form-grid">
                <div class="field-group">
                    <label>客户姓名</label>
                    <input id="f_customer" value="${esc(v.customer)}">
                </div>
                <div class="field-group">
                    <label>所在村庄</label>
                    <input id="f_name" value="${esc(v.name)}">
                </div>
                <div class="field-group">
                    <label>楼层数</label>
                    <input id="f_floors" type="number" min="1" max="20" value="${v.floors||2}">
                </div>
                <div class="field-group">
                    <label>建筑面积（㎡）</label>
                    <input id="f_area" type="number" step="0.01" value="${v.area||''}">
                </div>
            </div>
            <div class="form-grid" style="margin-top:14px;">
                <div class="field-group">
                    <label>负责人</label>
                    <input id="f_contact" value="${esc(v.contact||'')}">
                </div>
                <div class="field-group">
                    <label>联系电话</label>
                    <input id="f_phone" type="tel" value="${esc(v.phone||'')}">
                </div>
            </div>
            <div class="form-grid" style="margin-top:14px;">
                <div class="field-group">
                    <label>经度 (lng)</label>
                    <input id="f_lng" type="number" step="0.00001" value="${v.pos ? v.pos[0] : ''}" placeholder="如 115.0180">
                </div>
                <div class="field-group">
                    <label>纬度 (lat)</label>
                    <input id="f_lat" type="number" step="0.00001" value="${v.pos ? v.pos[1] : ''}" placeholder="如 33.4820">
                </div>
            </div>
            <div style="font-size:0.75rem;color:#888;margin-top:6px;">📍 坐标可在地图页点击地图获取，右下角会显示坐标值</div>
            <div class="form-grid full" style="margin-top:14px;">
                <div class="field-group">
                    <label>客户要求</label>
                    <textarea id="f_requirements">${esc(v.requirements||'')}</textarea>
                </div>
                <div class="field-group">
                    <label>备注</label>
                    <textarea id="f_note">${esc(v.note||'')}</textarea>
                </div>
            </div>
            <button class="save-btn" onclick="saveInfo()">💾 保存基本信息</button>
        </div>
    </div>

    <!-- 材料进场记录 -->
    <div class="card">
        <div class="card-header">📦 材料进场记录</div>
        <div class="mat-summary" id="matSummary"></div>
        <div id="matTablesWrap"></div>
    </div>`;
}

function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ==========================================
// 保存基本信息
// ==========================================
function saveInfo() {
    customer.customer     = document.getElementById('f_customer').value.trim();
    customer.name         = document.getElementById('f_name').value.trim();
    customer.floors       = parseInt(document.getElementById('f_floors').value) || 2;
    customer.area         = parseFloat(document.getElementById('f_area').value) || 0;
    customer.contact      = document.getElementById('f_contact').value.trim();
    customer.phone        = document.getElementById('f_phone').value.trim();
    customer.requirements = document.getElementById('f_requirements').value.trim();
    customer.note         = document.getElementById('f_note').value.trim();
    // 保存坐标
    const lng = parseFloat(document.getElementById('f_lng').value);
    const lat = parseFloat(document.getElementById('f_lat').value);
    if (!isNaN(lng) && !isNaN(lat)) {
        customer.pos = [lng, lat];
    }
    save();
    document.getElementById('pageTitle').textContent = `${customer.name} · ${customer.customer}`;
    document.title = `${customer.customer} - 客户详情`;
}

function bindInfoForm() {
    // 回车保存
    document.addEventListener('keydown', e => {
        if (e.ctrlKey && e.key === 's') { e.preventDefault(); saveInfo(); }
    });
}

// ==========================================
// 材料进场记录（Excel 风格内联表格）
// ==========================================
function initQuickAdd() { /* 占位，内联表格无需预初始化 */ }

function renderMaterials() {
    renderSummary();
    renderAllMatTables();
}

// 汇总卡片
function renderSummary() {
    const wrap = document.getElementById('matSummary');
    wrap.innerHTML = MATERIALS.map(mat => {
        const records = customer.materials[mat] || [];
        const total = records.reduce((s, r) => s + (parseFloat(r.qty) || 0), 0);
        const unit = MAT_UNITS[mat] || '吨';
        return `<div class="mat-card">
            <div class="mat-card-name">${mat}</div>
            <div class="mat-card-total">${total > 0 ? total.toFixed(1) : '-'}<span class="mat-card-unit">${total > 0 ? unit : ''}</span></div>
        </div>`;
    }).join('');
}

// 渲染所有材料 Excel 表
function renderAllMatTables() {
    const wrap = document.getElementById('matTablesWrap');
    wrap.innerHTML = MATERIALS.map(mat => renderMatSection(mat)).join('');
}

function renderMatSection(mat) {
    const records = customer.materials[mat] || [];
    const total = records.reduce((s, r) => s + (parseFloat(r.qty) || 0), 0);
    const unit = MAT_UNITS[mat] || '吨';
    const totalText = total > 0 ? `共计 ${total.toFixed(1)} ${unit}` : '暂无记录';
    return `
    <div class="mat-section" id="sec_${mat}">
        <div class="mat-section-header">
            <span class="mat-section-name">${mat}</span>
            <span class="mat-section-total" id="total_${mat}">${totalText}</span>
        </div>
        <div class="excel-wrap">
            <table class="excel-table">
                <thead><tr>
                    <th style="width:130px;">日期</th>
                    <th style="width:80px;">数量</th>
                    <th style="width:60px;">单位</th>
                    <th style="width:140px;">供应商</th>
                    <th>备注</th>
                    <th style="width:36px;"></th>
                </tr></thead>
                <tbody id="tbody_${mat}">
                    ${records.length === 0
                        ? `<tr><td colspan="6" class="no-records" style="padding:16px;border:1px solid #e8f0e8;">暂无记录，点击下方「+新增一行」开始填写</td></tr>`
                        : records.map((r, i) => buildExcelRow(mat, r, i)).join('')}
                </tbody>
            </table>
        </div>
        <div class="excel-add-row" onclick="addMatRow('${mat}')">➕ 新增一行</div>
    </div>`;
}

function buildExcelRow(mat, r, i) {
    const unit = MAT_UNITS[mat] || '吨';
    return `<tr id="exrow_${mat}_${i}">
        <td><input class="excel-cell" type="date" value="${r.date||''}" onchange="updateRec('${mat}',${i},'date',this.value)" onblur="save()"></td>
        <td><input class="excel-cell" type="number" step="0.01" value="${r.qty||''}" placeholder="-" onchange="updateRec('${mat}',${i},'qty',this.value)" onblur="save()"></td>
        <td><input class="excel-cell" value="${esc(r.unit||unit)}" placeholder="${unit}" onchange="updateRec('${mat}',${i},'unit',this.value)" onblur="save()"></td>
        <td><input class="excel-cell" value="${esc(r.supplier||'')}" placeholder="-" onchange="updateRec('${mat}',${i},'supplier',this.value)" onblur="save()"></td>
        <td><input class="excel-cell" value="${esc(r.remark||'')}" placeholder="-" onchange="updateRec('${mat}',${i},'remark',this.value)" onblur="save()"></td>
        <td><button class="excel-del" onclick="deleteRec('${mat}',${i})" title="删除">✕</button></td>
    </tr>`;
}

function addMatRow(mat) {
    const today = new Date().toISOString().split('T')[0];
    if (!customer.materials[mat]) customer.materials[mat] = [];
    customer.materials[mat].push({ date: today, qty: '', unit: MAT_UNITS[mat] || '吨', supplier: '', remark: '' });
    save();
    const tbody = document.getElementById(`tbody_${mat}`);
    const records = customer.materials[mat];
    const i = records.length - 1;
    if (tbody.querySelector('.no-records')) tbody.innerHTML = '';
    tbody.insertAdjacentHTML('beforeend', buildExcelRow(mat, records[i], i));
    const newRow = document.getElementById(`exrow_${mat}_${i}`);
    if (newRow) { const inp = newRow.querySelectorAll('.excel-cell')[1]; if (inp) inp.focus(); }
    updateMatTotal(mat);
    renderSummary();
}

function updateRec(mat, i, field, val) {
    if (customer.materials[mat] && customer.materials[mat][i] !== undefined) {
        customer.materials[mat][i][field] = val;
    }
    if (field === 'qty') updateMatTotal(mat);
}

function updateMatTotal(mat) {
    const records = customer.materials[mat] || [];
    const total = records.reduce((s, r) => s + (parseFloat(r.qty) || 0), 0);
    const unit = MAT_UNITS[mat] || '吨';
    const el = document.getElementById(`total_${mat}`);
    if (el) el.textContent = total > 0 ? `共计 ${total.toFixed(1)} ${unit}` : '暂无记录';
}

function deleteRec(mat, idx) {
    if (!confirm(`确定删除这条${mat}记录？`)) return;
    customer.materials[mat].splice(idx, 1);
    save();
    renderMaterials();
}
function deleteRecord(mat, idx) { deleteRec(mat, idx); }
function quickAddRecord() {}


</script>
</body>
</html>
