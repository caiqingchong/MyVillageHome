function loadVillages() {
    // 1. 加载基础客户
    let baseData;
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
        try {
            baseData = JSON.parse(raw);
            baseData.forEach(v => {
                if (!v.materials) v.materials = initMaterials();
                ['phone','contact','requirements'].forEach(k => { if (v[k] === undefined) v[k] = ''; });
                Object.keys(initMaterials()).forEach(m => { if (!v.materials[m]) v.materials[m] = []; });
            });
            // 同步 defaultVillages 新增的 id 及 status/region 字段
            const defaultMap = {};
            defaultVillages.forEach(dv => { defaultMap[dv.id] = dv; });
            const existingIds = new Set(baseData.map(v => v.id));
            defaultVillages.forEach(dv => {
                if (!existingIds.has(dv.id)) baseData.push(JSON.parse(JSON.stringify(dv)));
            });
            // 补充缺失的 status / region
            baseData.forEach(v => {
                if (!v.status) v.status = defaultMap[v.id]?.status || 'active';
                if (!v.region) v.region = defaultMap[v.id]?.region || '沈丘';
            });
            baseData.sort((a, b) => a.id - b.id);
        } catch(e) {
            baseData = JSON.parse(JSON.stringify(defaultVillages));
        }
    } else {
        baseData = JSON.parse(JSON.stringify(defaultVillages));
    }
    localStorage.setItem(STORAGE_KEY, JSON.stringify(baseData));

    // 2. 加载用户手动新增的客户（永不重置）
    let userAdded = [];
    try { userAdded = JSON.parse(localStorage.getItem(USER_KEY) || '[]'); } catch(e) {}

    // 3. 合并：基础 + 用户新增
    const baseIds = new Set(baseData.map(v => v.id));
    userAdded.forEach(v => { if (!baseIds.has(v.id)) baseData.push(v); });
    return baseData;
}

function saveVillages() {
    // 基础客户写入 STORAGE_KEY，手动新增写入 USER_KEY
    const defaultIds = new Set(defaultVillages.map(v => v.id));
    localStorage.setItem(STORAGE_KEY, JSON.stringify(villages.filter(v =>  defaultIds.has(v.id))));
    localStorage.setItem(USER_KEY,    JSON.stringify(villages.filter(v => !defaultIds.has(v.id))));
}

function getNextId() {
    return villages.length > 0 ? Math.max(...villages.map(v => v.id)) + 1 : 1;
}

function calcDist(pos1, pos2) {
    const R = 6371, toRad = d => d * Math.PI / 180;
    const dLat = toRad(pos2[1]-pos1[1]), dLng = toRad(pos2[0]-pos1[0]);
    const a = Math.sin(dLat/2)**2 + Math.cos(toRad(pos1[1]))*Math.cos(toRad(pos2[1]))*Math.sin(dLng/2)**2;
    return (R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))).toFixed(1);
}

            <div class="village-name">${v.name} · ${v.customer}</div>
            <div class="village-desc">${v.floors}层 · ${v.area > 0 ? v.area + '㎡' : '面积待定'}</div>
            <div class="village-desc" style="color:#888;">📍 距公司约 ${dist} km</div>
            <div class="status-badge ${badgeClass}">${badgeText}</div>
        </div>`;
    // 应用筛选
    if (currentFilter !== 'all' && status !== currentFilter) {
        item.style.display = 'none';
    }
    item.addEventListener('click', () => {
        map.setZoomAndCenter(16, v.pos);
        setTimeout(() => { infoWindow.setContent(popupHtml); infoWindow.open(map, marker.getPosition()); }, 500);
        if (activeItem) activeItem.classList.remove('active');
        item.classList.add('active'); activeItem = item;
    });
    listEl.appendChild(item);
}

// ==========================================
// 分享 & 复制位置功能
// ==========================================
function getShareText(id) {
    const v = villages.find(x => x.id === id);
    if (!v) return '';
    const statusLabel = v.status === 'done' ? '2025年已完工' : '2026年施工中';
    const mapUrl = `https://uri.amap.com/marker?position=${v.pos[0]},${v.pos[1]}&name=${encodeURIComponent(v.name+'·'+v.customer)}`;
    return `【范营大包建房 · 施工地址】\n客户：${v.customer}\n地址：${v.name}（${v.region}）\n状态：${statusLabel}\n坐标：${v.pos[1]}, ${v.pos[0]}\n高德地图：${mapUrl}`;
}

function copyLocation(id) {
    const text = getShareText(id);
    if (!text) return;
    navigator.clipboard.writeText(text).then(() => {
        // 临时改按钮文字提示成功
        const btns = document.querySelectorAll(`[onclick="copyLocation(${id})"]`);
        btns.forEach(b => { const old = b.textContent; b.textContent = '✅ 已复制'; b.style.background='#e8f5e9'; setTimeout(()=>{ b.textContent=old; b.style.background=''; },1800); });
    }).catch(() => {
        // 降级方案
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        alert('已复制到剪贴板！');
    });
}

function shareLocation(id) {
    const v = villages.find(x => x.id === id);
    if (!v) return;
    const mapUrl = `https://uri.amap.com/marker?position=${v.pos[0]},${v.pos[1]}&name=${encodeURIComponent(v.name+'·'+v.customer)}`;
    const shareData = {
        title: `${v.name} · ${v.customer} - 范营大包建房`,
        text: getShareText(id),
        url: mapUrl
    };
    if (navigator.share) {
        navigator.share(shareData).catch(() => {});
    } else {
        // 桌面端降级为复制
        copyLocation(id);
    }
}

// 注意：初始渲染已在 initAMap 回调中执行，此处不再重复调用
function updateCount() {
    const visible = currentFilter === 'all' ? villages.length
        : villages.filter(v => v.status === currentFilter).length;
    document.getElementById('villageCount').textContent = `${visible} 个`;
}
updateCount();

// ==========================================
// 搜索功能
// ==========================================
let searchKeyword = '';

function onSearch(val) {
    searchKeyword = val.trim();
    document.getElementById('searchClear').style.display = searchKeyword ? 'block' : 'none';
    applySearch();
}

function clearSearch() {
    searchKeyword = '';
    document.getElementById('searchInput').value = '';
    document.getElementById('searchClear').style.display = 'none';
    applySearch();
}

function applySearch() {
    const kw = searchKeyword.toLowerCase();
    let matchCount = 0;

    villages.forEach(v => {
        const item = document.getElementById(`item-${v.id}`);
        const marker = markerMap[v.id];
        if (!item) return;

        // 先判断状态筛选
        const statusOk = currentFilter === 'all' || v.status === currentFilter;
        // 再判断关键词匹配
        const kwOk = !kw
            || v.name.toLowerCase().includes(kw)
            || v.customer.toLowerCase().includes(kw);

        const show = statusOk && kwOk;
        item.style.display = show ? '' : 'none';
        if (marker) marker.setMap(show ? map : null);
        if (show) matchCount++;
    });

    // 无结果提示
    document.getElementById('searchNoResult').style.display = matchCount === 0 ? 'block' : 'none';

    // 搜索命中唯一结果时自动定位
    if (kw && matchCount === 1) {
        const hit = villages.find(v => {
            const statusOk = currentFilter === 'all' || v.status === currentFilter;
            return statusOk && (v.name.toLowerCase().includes(kw) || v.customer.toLowerCase().includes(kw));
        });
        if (hit && map) {
            map.setZoomAndCenter(16, hit.pos);
            const marker = markerMap[hit.id];
            if (marker) {
                const dist = calcDist(hit.pos, companyPos);
                const status = hit.status || 'active';
                const popupHtml = `<div style="background:white;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,0.18);padding:14px 16px;min-width:195px;font-family:-apple-system,'PingFang SC',sans-serif;position:relative;">
                    <div onclick="closeInfo()" style="position:absolute;top:8px;right:10px;cursor:pointer;color:#aaa;font-size:15px;">&#x2715;</div>
                    <div style="font-size:1rem;font-weight:bold;color:#1a3a1a;margin-bottom:7px;padding-bottom:7px;border-bottom:1px solid #e0eee0;">📍 ${hit.name} ${status==='done'?'<span style="background:#fff0e0;color:#e8820c;font-size:0.72rem;padding:1px 6px;border-radius:4px;margin-left:4px;">已完工</span>':'<span style="background:#e8f4e8;color:#2c5f2d;font-size:0.72rem;padding:1px 6px;border-radius:4px;margin-left:4px;">施工中</span>'}</div>
                    <div style="font-size:0.82rem;color:#555;line-height:1.9;">客户：<b>${hit.customer}</b></div>
                    <div style="font-size:0.82rem;color:#555;line-height:1.9;">楼层：<b>${hit.floors}层</b> &nbsp; 面积：<b>${hit.area}㎡</b></div>
                    <div style="font-size:0.82rem;color:#555;line-height:1.9;">距公司：<b style="color:#2c5f2d;">约 ${dist} km</b></div>
                    ${hit.note ? `<div style="font-size:0.78rem;color:#d35400;margin-top:4px;padding:4px 6px;background:#fff3e0;border-radius:4px;">⚠️ ${hit.note}</div>` : ''}
                    <a href="customer.html?id=${hit.id}" style="display:block;margin-top:10px;text-align:center;background:#2c5f2d;color:white;padding:8px;border-radius:7px;font-size:0.85rem;text-decoration:none;font-weight:bold;">📋 查看/编辑客户详情 →</a>
                    <div style="width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:8px solid white;position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);"></div>
                </div>`;
                setTimeout(() => { infoWindow.setContent(popupHtml); infoWindow.open(map, marker.getPosition()); }, 400);
            }
        }
    }

    // 更新计数
    document.getElementById('villageCount').textContent = `${matchCount} 个`;
}

// focus 和 visibilitychange 监听已在 initAMap 中统一注册

// ==========================================
// 地图图层切换 & 刷新
// ==========================================
function switchLayer(type) {
    if (type === 'street') {
        map.setLayers([new AMap.TileLayer()]);
        document.getElementById('btnStreet').classList.add('active');
        document.getElementById('btnSatellite').classList.remove('active');
    } else {
        map.setLayers([new AMap.TileLayer.Satellite(), new AMap.TileLayer.RoadNet()]);
        document.getElementById('btnSatellite').classList.add('active');
        document.getElementById('btnStreet').classList.remove('active');
    }
}
function locateAll() { map.setZoomAndCenter(12, [115.08, 33.46]); }

// 手动刷新地图标注
function refreshMap() {
    villages = loadVillages();
    Object.values(markerMap).forEach(m => { try { m.setMap(null); } catch(e) {} });
    for (let k in markerMap) delete markerMap[k];
    listEl.innerHTML = '';
    villages.forEach(v => renderVillage(v));
    updateCount();
    showToast(`✅ 已刷新 ${villages.length} 个客户标注`);
}


// Toast 提示
function showToast(msg) {
    let t = document.getElementById('mapToast');
    if (!t) {
        t = document.createElement('div');
        t.id = 'mapToast';
        t.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(44,95,45,0.95);color:white;padding:10px 22px;border-radius:24px;font-size:0.88rem;z-index:9999;transition:opacity 0.3s;';
        document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.opacity = '1';
    setTimeout(() => { t.style.opacity = '0'; }, 3000);
}

// 后台地理编码（不阻塞用户操作）
function tryGeocodeInBackground(customer, geoAddr, poiAddr) {
    let done = false;

    function updatePos(pos, source) {
        if (done) return;
        done = true;
        // 更新客户坐标
        const idx = villages.findIndex(v => v.id === customer.id);
        if (idx >= 0) {
            villages[idx].pos = pos;
            saveVillages();
            // 更新地图标注位置
            if (markerMap[customer.id]) {
                markerMap[customer.id].setPosition(new AMap.LngLat(pos[0], pos[1]));
                map.setZoomAndCenter(15, pos);
            }
            showToast(`✅ 已自动定位到「${customer.name}」`);
            console.log('地理编码成功:', source, pos);
        }
    }

    // 超时保护（15秒后放弃）
    setTimeout(() => {
        if (!done) {
            done = true;
            console.log('地理编码超时，保留默认位置');
        }
    }, 15000);

    // Geocoder
    try {
        const geocoder = new AMap.Geocoder({ city: '周口市' });
        geocoder.getLocation(geoAddr, function(status, result) {
            if (done) return;
            if (status === 'complete' && result.geocodes && result.geocodes.length > 0) {
                const loc = result.geocodes[0].location;
                updatePos([parseFloat(loc.getLng().toFixed(5)), parseFloat(loc.getLat().toFixed(5))], 'Geocoder');
            }
        });
    } catch(e) { console.warn('Geocoder异常:', e); }

    // PlaceSearch
    try {
        const ps = new AMap.PlaceSearch({ city: '周口市', pageSize: 1 });
        ps.search(poiAddr, function(status, result) {
            if (done) return;
            const pois = result && result.poiList && result.poiList.pois;
            if (status === 'complete' && pois && pois.length > 0) {
                const loc = pois[0].location;
                updatePos([parseFloat(loc.getLng().toFixed(5)), parseFloat(loc.getLat().toFixed(5))], 'PlaceSearch');
            }
        });
    } catch(e) { console.warn('PlaceSearch异常:', e); }
}
