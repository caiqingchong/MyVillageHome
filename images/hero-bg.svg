<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><linearGradient id="a" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#f5efe0"/><stop offset="40%" stop-color="#ede4c8"/><stop offset="100%" stop-color="#d9ceaf"/></linearGradient><filter><feTurbulence baseFrequency=".65" numOctaves="3" stitchTiles="stitch" type="fractalNoise"/><feColorMatrix type="saturate" values="0"/><feBlend in="SourceGraphic" mode="multiply" result="blend"/><feComposite in="blend" in2="SourceGraphic" operator="in"/></filter></defs><path fill="url(#a)" d="M0 0h1920v1080H0z"/><path fill="#c8b89a" d="M0 0h1920v1080H0z" opacity=".08"/><path stroke="#5a4020" stroke-width="1.2" d="M200 60v960" opacity=".18"/><path stroke="#5a4020" stroke-width=".8" d="M400 60v960M1520 60v960" opacity=".1"/><path stroke="#5a4020" stroke-width="1.2" d="M1720 60v960" opacity=".18"/><path stroke="#5a4020" d="M80 100h1760M80 980h1760" opacity=".15"/><text x="960" y="195" fill="#1a0f00" font-family="'STKaiti','KaiTi','SimKai','华文楷体','楷体',serif" font-size="110" font-weight="bold" letter-spacing="18" opacity=".88" text-anchor="middle">归园田居</text><text x="960" y="268" fill="#3d2800" font-family="'STKaiti','KaiTi','SimKai','华文楷体','楷体',serif" font-size="42" letter-spacing="8" opacity=".7" text-anchor="middle">—— 陶渊明</text><path stroke="#6b4c1e" stroke-width="1.5" d="M580 292h760" opacity=".3"/><text x="540" y="388" fill="#1a0f00" font-family="'STKaiti','KaiTi','SimKai','华文楷体','楷体',serif" font-size="52" letter-spacing="6" opacity=".82" text-anchor="middle">少无适俗韵，性本爱丘山。</text><text x="540" y="458" fill="#1a0f00" font-family="'STKaiti','KaiTi','SimKai','华文楷体','楷体',serif" font-size="52" letter-spacing="6" opacity=".82" text-anchor="middle">误落尘网中，一去三十年。</text><text x="540" y="528" fill="#1a0f00" font-family="'STKaiti','KaiTi','SimKai','华文楷体','楷体',serif" font-size="52" letter-spacing="6" opacity=".82" text-anchor="middle">羁鸟恋旧林，池鱼思故渊。</text><text x="540" y="598" fill="#1a0f00" font-family="'STKaiti','KaiTi','SimKai','华文楷体','楷体',serif" font-size="52" letter-spacing="6" opacity=".82" text-anchor="middle">开荒南野际，守拙归园田。</text><text x="540" y="668" fill="#1a0f00" font-family="'STKaiti','KaiTi','SimKai','华文楷体','楷体',serif" font-size="52" letter-spacing="6" opacity=".82" text-anchor="middle">方宅十余亩，草屋八九间。</text><text x="540" y="738" fill="#1a0f00" font-family="'STKaiti','KaiTi','SimKai','华文楷体','楷体',serif" font-size="52" letter-spacing="6" opacity=".82" text-anchor="middle">榆柳荫后檐，桃李罗堂前。</text><text x="1380" y="388" fill="#1a0f00" font-family="'STKaiti','KaiTi','SimKai','华文楷体','楷体',serif" font-size="52" letter-spacing="6" opacity=".82" text-anchor="middle">暧暧远人村，依依墟里烟。</text><text x="1380" y="458" fill="#1a0f00" font-family="'STKaiti','KaiTi','SimKai','华文楷体','楷体',serif" font-size="52" letter-spacing="6" opacity=".82" text-anchor="middle">狗吠深巷中，鸡鸣桑树颠。</text><text x="1380" y="528" fill="#1a0f00" font-family="'STKaiti','KaiTi','SimKai','华文楷体','楷体',serif" font-size="52" letter-spacing="6" opacity=".82" text-anchor="middle">户庭无尘杂，虚室有余闲。</text><text x="1380" y="598" fill="#1a0f00" font-family="'STKaiti','KaiTi','SimKai','华文楷体','楷体',serif" font-size="52" letter-spacing="6" opacity=".82" text-anchor="middle">久在樊笼里，复得返自然。</text><path stroke="#8b6914" stroke-dasharray="6 6" stroke-width="1.5" d="M960 310v470" opacity=".22"/><rect width="100" height="100" x="1740" y="880" fill="#c0392b" opacity=".82" rx="6"/><text x="1790" y="925" fill="#fff" font-family="'STKaiti','KaiTi',serif" font-size="28" font-weight="bold" text-anchor="middle">归</text><text x="1790" y="960" fill="#fff" font-family="'STKaiti','KaiTi',serif" font-size="28" font-weight="bold" text-anchor="middle">园</text><rect width="76" height="76" x="82" y="118" fill="none" stroke="#c0392b" stroke-width="2.5" opacity=".65" rx="4"/><text x="120" y="150" fill="#c0392b" font-family="'STKaiti','KaiTi',serif" font-size="22" opacity=".65" text-anchor="middle">田</text><text x="120" y="178" fill="#c0392b" font-family="'STKaiti','KaiTi',serif" font-size="22" opacity=".65" text-anchor="middle">园</text></svg>