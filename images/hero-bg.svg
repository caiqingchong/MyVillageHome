<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <!-- 宣纸米黄色渐变背景 -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5efe0;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#ede4c8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d9ceaf;stop-opacity:1" />
    </linearGradient>
    <!-- 墨迹纹理噪点 -->
    <filter id="inkTexture">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- 宣纸背景 -->
  <rect width="1920" height="1080" fill="url(#paperGrad)" />

  <!-- 纹理叠加 -->
  <rect width="1920" height="1080" fill="#c8b89a" opacity="0.08" />

  <!-- 竖向水墨装饰线 -->
  <line x1="200" y1="60" x2="200" y2="1020" stroke="#5a4020" stroke-width="1.2" opacity="0.18"/>
  <line x1="400" y1="60" x2="400" y2="1020" stroke="#5a4020" stroke-width="0.8" opacity="0.1"/>
  <line x1="1520" y1="60" x2="1520" y2="1020" stroke="#5a4020" stroke-width="0.8" opacity="0.1"/>
  <line x1="1720" y1="60" x2="1720" y2="1020" stroke="#5a4020" stroke-width="1.2" opacity="0.18"/>

  <!-- 横向装饰线 -->
  <line x1="80" y1="100" x2="1840" y2="100" stroke="#5a4020" stroke-width="1" opacity="0.15"/>
  <line x1="80" y1="980" x2="1840" y2="980" stroke="#5a4020" stroke-width="1" opacity="0.15"/>

  <!-- 标题：归园田居 -->
  <text x="960" y="195"
    font-family="'STKaiti','KaiTi','SimKai','华文楷体','楷体',serif"
    font-size="110"
    font-weight="bold"
    fill="#1a0f00"
    opacity="0.88"
    text-anchor="middle"
    letter-spacing="18">归园田居</text>

  <!-- 作者：陶渊明 -->
  <text x="960" y="268"
    font-family="'STKaiti','KaiTi','SimKai','华文楷体','楷体',serif"
    font-size="42"
    fill="#3d2800"
    opacity="0.70"
    text-anchor="middle"
    letter-spacing="8">—— 陶渊明</text>

  <!-- 装饰横线 -->
  <line x1="580" y1="292" x2="1340" y2="292" stroke="#6b4c1e" stroke-width="1.5" opacity="0.30"/>

  <!-- 诗文正文（两列对称排列） -->
  <!-- 左列 第一组 -->
  <text x="540" y="388" font-family="'STKaiti','KaiTi','SimKai','华文楷体','楷体',serif"
    font-size="52" fill="#1a0f00" opacity="0.82" text-anchor="middle" letter-spacing="6">少无适俗韵，性本爱丘山。</text>

  <text x="540" y="458" font-family="'STKaiti','KaiTi','SimKai','华文楷体','楷体',serif"
    font-size="52" fill="#1a0f00" opacity="0.82" text-anchor="middle" letter-spacing="6">误落尘网中，一去三十年。</text>

  <text x="540" y="528" font-family="'STKaiti','KaiTi','SimKai','华文楷体','楷体',serif"
    font-size="52" fill="#1a0f00" opacity="0.82" text-anchor="middle" letter-spacing="6">羁鸟恋旧林，池鱼思故渊。</text>

  <text x="540" y="598" font-family="'STKaiti','KaiTi','SimKai','华文楷体','楷体',serif"
    font-size="52" fill="#1a0f00" opacity="0.82" text-anchor="middle" letter-spacing="6">开荒南野际，守拙归园田。</text>

  <text x="540" y="668" font-family="'STKaiti','KaiTi','SimKai','华文楷体','楷体',serif"
    font-size="52" fill="#1a0f00" opacity="0.82" text-anchor="middle" letter-spacing="6">方宅十余亩，草屋八九间。</text>

  <text x="540" y="738" font-family="'STKaiti','KaiTi','SimKai','华文楷体','楷体',serif"
    font-size="52" fill="#1a0f00" opacity="0.82" text-anchor="middle" letter-spacing="6">榆柳荫后檐，桃李罗堂前。</text>

  <!-- 右列 第二组 -->
  <text x="1380" y="388" font-family="'STKaiti','KaiTi','SimKai','华文楷体','楷体',serif"
    font-size="52" fill="#1a0f00" opacity="0.82" text-anchor="middle" letter-spacing="6">暧暧远人村，依依墟里烟。</text>

  <text x="1380" y="458" font-family="'STKaiti','KaiTi','SimKai','华文楷体','楷体',serif"
    font-size="52" fill="#1a0f00" opacity="0.82" text-anchor="middle" letter-spacing="6">狗吠深巷中，鸡鸣桑树颠。</text>

  <text x="1380" y="528" font-family="'STKaiti','KaiTi','SimKai','华文楷体','楷体',serif"
    font-size="52" fill="#1a0f00" opacity="0.82" text-anchor="middle" letter-spacing="6">户庭无尘杂，虚室有余闲。</text>

  <text x="1380" y="598" font-family="'STKaiti','KaiTi','SimKai','华文楷体','楷体',serif"
    font-size="52" fill="#1a0f00" opacity="0.82" text-anchor="middle" letter-spacing="6">久在樊笼里，复得返自然。</text>

  <!-- 中间竖向分隔装饰 -->
  <line x1="960" y1="310" x2="960" y2="780" stroke="#8b6914" stroke-width="1.5" opacity="0.22" stroke-dasharray="6,6"/>

  <!-- 印章装饰（右下角） -->
  <rect x="1740" y="880" width="100" height="100" rx="6" fill="#c0392b" opacity="0.82"/>
  <text x="1790" y="925" font-family="'STKaiti','KaiTi',serif" font-size="28" fill="white"
    text-anchor="middle" font-weight="bold">归</text>
  <text x="1790" y="960" font-family="'STKaiti','KaiTi',serif" font-size="28" fill="white"
    text-anchor="middle" font-weight="bold">园</text>

  <!-- 左上角小印章 -->
  <rect x="82" y="118" width="76" height="76" rx="4" fill="none" stroke="#c0392b" stroke-width="2.5" opacity="0.65"/>
  <text x="120" y="150" font-family="'STKaiti','KaiTi',serif" font-size="22" fill="#c0392b"
    text-anchor="middle" opacity="0.65">田</text>
  <text x="120" y="178" font-family="'STKaiti','KaiTi',serif" font-size="22" fill="#c0392b"
    text-anchor="middle" opacity="0.65">园</text>
</svg>
